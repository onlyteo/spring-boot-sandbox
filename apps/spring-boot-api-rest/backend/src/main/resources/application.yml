### APP ###
app:
  # Resources
  resources:
    prefixes-file: /data/prefixes.csv

### SPRING ###
spring:
  # Application
  application:
    name: spring-boot-rest-api-backend
  # Profiles
  profiles:
    active: development
  # Jackson
  jackson:
    date-format: com.fasterxml.jackson.databind.util.StdDateFormat
    default-property-inclusion: NON_NULL
    datetime:
      ADJUST_DATES_TO_CONTEXT_TIME_ZONE: false
