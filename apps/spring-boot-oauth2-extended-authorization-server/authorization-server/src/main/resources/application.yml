### APP ###
app:
  # Security
  security:
    whitelisted-paths:
      - /webjars/**
      - /assets/**
      - /favicon.ico
      - /error
      - /register

### SPRING ###
spring:
  # Application
  application:
    name: spring-boot-oauth2-authorization-server-extended-authorization-server
  # Profiles
  profiles:
    active: development
  # Messages
  messages:
    basename: locale/messages
  # Jackson
  jackson:
    date-format: com.fasterxml.jackson.databind.util.StdDateFormat
    default-property-inclusion: NON_NULL
    datetime:
      ADJUST_DATES_TO_CONTEXT_TIME_ZONE: false
  # JPA
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
